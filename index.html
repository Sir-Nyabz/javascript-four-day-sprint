<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Task Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <header class="page-header">
            <h1>My Task Manager</h1>
            <p>Organise your activities and track your progress.</p>
        </header>

        <section class="card">
            <h2>Add a New Task</h2>

            <form id="taskForm">
                <div class="form-group">
                    <label for="taskTitle">Task Title</label>
                    <input
                        type="text"
                        id="taskTitle"
                        placeholder="What do you need to do?"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    <textarea
                        id="taskDescription"
                        placeholder="Add more details"
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="taskPriority">Priority</label>
                    <select id="taskPriority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>

                <button type="submit">Add Task</button>
                <p id="message" role="status"></p>
            </form>
        </section>

        <section class="dashboard">
    <div class="summary-card">
        <h3>Total Tasks</h3>
        <p id="total-tasks">0</p>
    </div>

    <div class="summary-card">
        <h3>Completed</h3>
        <p id="completed-tasks">0</p>
    </div>

    <div class="summary-card">
        <h3>Pending</h3>
        <p id="pending-tasks">0</p>
    </div>
</section>

        <section class="suggestions">
    <h2>Suggested Tasks</h2>

    <button id="load-suggestions">
        Load Suggested Tasks
    </button>

    <div id="loading-indicator" class="loading hidden">
        <span class="spinner"></span>
        <span>Loading suggested tasks...</span>
    </div>

    <p id="api-message" role="status" aria-live="polite"></p>

    <div id="suggested-tasks"></div>
</section>

        <section class="task-section">
            <h2>My Tasks</h2>

            <div class="toolbar">
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search tasks..."
                >

                <select id="filterSelect" aria-label="Filter tasks">
                    <option value="all">All Tasks</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <div id="taskSummary" class="summary"></div>

            <div id="taskList" class="task-list"></div>

            <p id="emptyMessage">No tasks found. Add your first task!</p>
        </section>
    </main>

    <script type="module" src="src/app.js"></script>
    <script type="module" src="src/api-demo.js"></script>
</body>
</html>
